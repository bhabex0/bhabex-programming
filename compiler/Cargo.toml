[package]
name = "bhabex-compiler"
version = "0.1.0"
edition = "2021"
description = "Bhabex compiler - lexer, parser, bytecode compiler, and native backend"
license = "MIT"
repository = "https://github.com/bxLabs/bhabex"

[dependencies]
thiserror = "1.0"
logos = "0.13"
indexmap = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"