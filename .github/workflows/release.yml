name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: false
        type: boolean

env:
  PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' pyproject.toml
          cat pyproject.toml | grep version

      - name: Build package
        run: python -m build

      - name: Verify package
        run: |
          twine check dist/*
          pip install dist/*.whl
          python -c "import bhabex; print('Package works')"

      - name: Publish to PyPI
        if: github.event.inputs.dry_run != 'true'
        run: |
          twine upload --repository pypi dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bhabex v${{ steps.version.outputs.version }}
          body: |
            ## Bhabex v${{ steps.version.outputs.version }}

            ### Changes
            - See commit log for details

            ### Installation
            ```bash
            pip install bhabex==${{ steps.version.outputs.version }}
            ```

            ### Usage
            ```bash
            bx run hello.bx
            bx build --native hello.bx
            bx repl
            ```

            See [documentation](https://bhabex.dev/docs) for full guide.
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      - name: Build and attach wheel artifacts
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Dry run - would publish to PyPI and create GitHub release"
          ls -la dist/