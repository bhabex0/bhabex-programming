name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install colored anyio

      - name: Run ruff
        run: ruff check bhabex/

      - name: Run black
        run: black --check bhabex/

      - name: Run mypy
        run: mypy bhabex/

      - name: Run pytest
        run: pytest tests/ -v

      - name: Test CLI
        run: |
          python -m bhabex.main run examples/hello.bx
          python -m bhabex.main check examples/hello.bx
          python -m bhabex.main tokens examples/hello.bx
          python -m bhabex.main parse examples/hello.bx
          python -m bhabex.main fmt --check examples/hello.bx

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          python -c "import bhabex; print('Package imported successfully')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check bhabex_minimal
        working-directory: bhabex_minimal
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo build
          cargo test

      - name: Check velo-compiler (if LLVM available)
        working-directory: velo-compiler
        run: |
          if command -v llvm-config &> /dev/null; then
            cargo check --workspace 2>&1 | head -50
          else
            echo "LLVM not available, skipping velo-compiler check"
          fi
        continue-on-error: true

  windows-test:
    name: Windows Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install colored anyio

      - name: Run tests
        run: pytest tests/ -v

      - name: Test CLI
        run: |
          python -m bhabex.main run examples/hello.bx
          python -m bhabex.main check examples/hello.bx

      - name: Rust build
        run: |
          cd bhabex_minimal
          cargo build --release

  macos-test:
    name: macOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install colored anyio

      - name: Run tests
        run: pytest tests/ -v

      - name: Rust build
        run: |
          cd bhabex_minimal
          cargo build --release

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build docs
        run: |
          sphinx-build -b html docs/ docs/_build/html

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html