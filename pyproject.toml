[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhabex"
version = "0.1.0"
description = "Bhabex - A modern, high-performance programming language with bytecode VM and native compilation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "bxLabs", email = "contact@bhabex.dev"}
]
maintainers = [
    {name = "bxLabs", email = "contact@bhabex.dev"}
]
keywords = [
    "programming-language",
    "compiler",
    "interpreter",
    "bytecode",
    "vm",
    "bhabex"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "colored>=2.2.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
http = [
    "aiohttp>=3.8.0",
]
crypto = [
    "cryptography>=41.0.0",
]
db = [
    "aiosqlite>=0.19.0",
]
full = [
    "aiohttp>=3.8.0",
    "cryptography>=41.0.0",
    "aiosqlite>=0.19.0",
]

[project.urls]
Homepage = "https://bhabex.dev"
Repository = "https://github.com/bxLabs/bhabex"
Documentation = "https://bhabex.dev/docs"
Issues = "https://github.com/bxLabs/bhabex/issues"

[project.scripts]
bx = "bhabex.main:main"

[project.entry-points."console_scripts"]
bx = "bhabex.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bhabex*"]

[tool.setuptools.package-data]
"*" = ["*.bx", "*.json", "*.toml", "*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PIE"]
ignore = ["E501", "B008"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.sphinx]
source-dir = "docs"
build-dir = "docs/_build"

[tool.tox]
envlist = ["py310", "py311", "py312", "py313"]

[tool.tox.envrun]
commands = [
    "pytest {posargs:tests}",
]